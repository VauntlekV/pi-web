name: Release

# Cut a release with `npm version patch|minor|major` on a clean main: it bumps
# package.json, tags vX.Y.Z and pushes. This workflow then runs the full CI,
# publishes to npm with provenance and creates the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm & GitHub
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/@vauntlek/pi-web
    permissions:
      contents: write # GitHub Release
      id-token: write # npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm >= 11.5.1.
      - run: npm install --global npm@11

      - name: Check the tag matches package.json
        id: meta
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          case "$version" in
            *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT"; echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT"; echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run build
      - name: Pack
        id: pack
        run: echo "file=$(npm pack --silent | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        env:
          # Optional fallback; with a trusted publisher configured on npmjs.com no token is needed.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if npm view "${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" version >/dev/null 2>&1; then
            echo "::notice::${{ steps.meta.outputs.version }} is already on npm, skipping publish"
            exit 0
          fi
          npm publish "./${{ steps.pack.outputs.file }}" --access public --provenance \
            --tag "${{ steps.meta.outputs.dist_tag }}" --ignore-scripts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" --clobber
          else
            flags=""
            if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
            gh release create "$GITHUB_REF_NAME" "${{ steps.pack.outputs.file }}" \
              --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $flags
          fi
